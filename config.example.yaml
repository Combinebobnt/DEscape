# Pixel size of the Ruler's on-map measurement label, Settings > Appearance.
# Only 8-32 are legal; anything else falls back to the default.
# Default: 18.
ruler_label_font_px: 18

# Pixel size of the map-edge distance ruler's major-tick numbers, Settings >
# Appearance. Only 8-24 are
# legal; anything else falls back to the default.
# Default: 12.
distance_tick_font_px: 12

# DEscape's own UI font, Settings > Appearance -- app chrome only (menus,
# dialogs, panels, the status log); the map view's overlay text keeps its
# own fixed sizes. "" means the platform default family.
ui_font_family: ""

# Point size for the same, 7-20; anything else (or null) means
# the platform default size.
ui_font_size: null

# Every tool overlay color (Settings > Appearance), shown here at its
# default -- see settings.OVERLAY_COLORS for the full id/label/default list.
# RGB only, as "#rrggbb"; omit an entry to leave that element at its default.
overlay_colors:
  highlight_outline: '#ffd700'
  highlight_fill: '#ffd700'
  pan_highlight: '#000000'
  unit_hover: '#ffffff'
  unit_select: '#50aaff'
  unit_select_fill: '#50aaff'
  unit_stack: '#ffd24a'
  unit_stack_background: '#000000'
  footprint_outline: '#c8c8c8'
  range_ring: '#404040'
  ruler_line: '#ff8228'
  ruler_label: '#ffbe6e'
  ruler_label_outline: '#000000'
  region_fill: '#3ce6c8'
  region_outline: '#141414'
  region_ants: '#3ce6c8'
  mirror_overlay: '#50dcff'
  analysis_marker: '#ff3c3c'
  trigger_area_outline: '#7ce650'
  trigger_area_fill: '#7ce650'
  trigger_run: '#b4f078'
  trigger_unit_ref: '#3cd28c'

# Opacity of three overlay groups (Settings > Appearance), in percent: the
# Units selection (and its marquee), a selected map region, and the trigger
# overlay's areas. A multiplier on the whole group, on top of its colours;
# 100 is the original look. Only
# 10-100 are legal; anything else falls back to that
# group's default (100).
overlay_opacity:
  unit_select: 100
  region: 100
  trigger_area: 100

# How the Triggers panel marks each trigger, condition and effect whose
# required fields are all set and whose references resolve (ok), or that is
# missing something (problem), Settings > Appearance > Trigger status. That is
# a completeness check, not a promise the trigger works in game. One of
# color, icon, both, off; anything else falls back to the default.
# Default: color.
trigger_status_marker: color

# Whether rows that pass are marked too. false leaves only problems marked:
# a row that passes gets no colour and no tick, in every marker mode.
# Default: true.
trigger_status_color_ok_rows: true

# The two marker colours, as "#rrggbb"; omit one to leave it at its default.
trigger_status_colors:
  ok: '#4caf50'
  problem: '#e05252'

# Settings > Saving. Autosave writes its own rotating recovery slot on a
# timer, never the file you have open, and never clears the unsaved-changes
# marker -- File > Recover from Autosave... is how you open one back up.
# Default: true.
autosave_enabled: true

# Minutes between autosave ticks. Only 1, 2, 5, 10, 15, 30 are legal;
# anything else falls back to the default. Default: 5.
autosave_interval_min: 5

# How many autosave slots to keep per document before the oldest is deleted.
# Only 1, 2, 3, 5, 10 are legal; anything else falls back to the
# default. Default: 3.
autosave_retention: 3

# Where autosave slots go: "central" (the autosave folder, autosave_dir
# below) or "sidecar" (beside the scenario itself). Sidecar falls back to
# the autosave folder for any document it cannot serve: an untitled one, a
# mods/subscribed/ path, one in the game's own profile folder, or a
# shipped template. Default: "central".
autosave_location: central

# The autosave folder, as an absolute path. "" means the default, an
# autosave/ folder beside this config file, which also always holds the
# autosave index. A subscribed-mods (mods/subscribed/) path or a relative
# one is ignored.
# If the folder is missing when an autosave runs, that slot goes to the
# default folder instead; the folder is never created. Switching folders
# leaves existing autosaves where they are, still listed in Recover.
# Default: "".
autosave_dir: ""

# Whether a real save also writes the .bak (previous contents) and .orig
# (one-time pristine snapshot) pair beside the file. Default: true.
backups_enabled: true
