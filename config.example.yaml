  file_new: Ctrl+N
  file_new_default: ''
  file_open: Ctrl+O
  file_close: Ctrl+W
  file_save: Ctrl+S
  file_save_as: Ctrl+Shift+S
  file_exit: Ctrl+Q
  edit_undo: Ctrl+Z
  edit_redo: Ctrl+Y
  edit_copy: Ctrl+C
  edit_paste: Ctrl+V
  edit_select_all: Ctrl+A
  edit_deselect: Ctrl+Shift+A
  edit_clipboard_history: ''
  edit_settings: ''
  edit_disables: ''
  map_mirror: ''
  view_isometric: Ctrl+Shift+I
  view_distance_ticks: ''
  view_show_sprites: ''
  view_stack_badges: ''
  view_grid_overlay: ''
  view_grid_follow: ''
  view_footprint_outlines: ''
  view_layer_terrain_textures: ''
  view_layer_farm_overlay: ''
  view_layer_small_trees: ''
  view_pan_up: Up
  view_pan_down: Down
  view_pan_left: Left
  view_pan_right: Right
  analysis_run: ''
  help_about: ''
  help_debug_log: ''
  help_perf_trace: ''
  mode_view: Ctrl+I
  mode_terrain: Ctrl+E
  mode_units: Ctrl+U
  mode_triggers: Ctrl+T
  mode_map_options: Ctrl+M
  mode_players: Ctrl+P
  mode_diplomacy: Ctrl+D
  mode_messages: Ctrl+Shift+M
  filter_show_gaia: ''
  filter_show_trees: ''
  filter_show_walls: ''
  filter_show_eye_candy: ''
  filter_all_players: ''
  filter_no_players: ''
  filter_show_all: ''
  filter_hide_all: ''
  unit_rotate_ccw: ','
  unit_rotate_cw: .
  unit_rotate_ccw_coarse: <
  unit_rotate_cw_coarse: '>'
  unit_variant_prev: ;
  unit_variant_next: ''''
  unit_variant_random: '-'
  player_select_0: '0'
  player_select_1: '1'
  player_select_2: '2'
  player_select_3: '3'
  player_select_4: '4'
  player_select_5: '5'
  player_select_6: '6'
  player_select_7: '7'
  player_select_8: '8'
  tool_pan: M
  tool_draw: D
  tool_fill: P
  tool_elevation: E
  tool_set_level: L
  tool_draw_line: ''
  tool_draw_rect: ''
  tool_cliff: ''
  tool_eyedropper: I
  tool_select: S
  tool_ruler: R
  tool_place_unit: ''
  tool_convert: ''
  tool_wall_run: ''
  adjust_increment: ']'
  adjust_decrement: '['

# Pixel size of the Ruler's on-map measurement label, Settings > Appearance.
# Only 8-32 are legal; anything else falls back to the default.
# Default: 18.
ruler_label_font_px: 18

# Pixel size of the map-edge distance ruler's major-tick numbers, Settings >
# Appearance. Only 8-24 are
# legal; anything else falls back to the default.
# Default: 12.
distance_tick_font_px: 12

# DEscape's own UI font, Settings > Appearance -- app chrome only (menus,
# dialogs, panels, the status log); the map view's overlay text keeps its
# own fixed sizes. "" means the platform default family.
ui_font_family: ""

# Point size for the same, 7-20; anything else (or null) means
# the platform default size.
ui_font_size: null

# Every tool overlay color (Settings > Appearance), shown here at its
# default -- see settings.OVERLAY_COLORS for the full id/label/default list.
# RGB only, as "#rrggbb"; omit an entry to leave that element at its default.
overlay_colors:
  highlight_outline: '#ffd700'
  highlight_fill: '#ffd700'
  pan_highlight: '#000000'
  unit_hover: '#ffffff'
  unit_select: '#50aaff'
  unit_select_fill: '#50aaff'
  unit_stack: '#ffd24a'
  footprint_outline: '#e65ae6'
  ruler_line: '#ff8228'
  ruler_label: '#ffbe6e'
  ruler_label_outline: '#000000'
  region_fill: '#3ce6c8'
  region_outline: '#141414'
  region_ants: '#3ce6c8'
  mirror_overlay: '#50dcff'

# Settings > Saving. Autosave writes its own rotating recovery slot on a
# timer, never the file you have open, and never clears the unsaved-changes
# marker -- File > Recover from Autosave... is how you open one back up.
# Default: true.
autosave_enabled: true

# Minutes between autosave ticks. Only 1, 2, 5, 10, 15, 30 are legal;
# anything else falls back to the default. Default: 5.
autosave_interval_min: 5

# How many autosave slots to keep per document before the oldest is deleted.
# Only 1, 2, 3, 5, 10 are legal; anything else falls back to the
# default. Default: 3.
autosave_retention: 3

# Where autosave slots go: "central" (an autosave/ folder beside this config
# file) or "sidecar" (beside the scenario itself). Sidecar falls back to
# central for any document it cannot serve -- an untitled one, a Steam
# Workshop/Proton path, or a shipped template. Default: "central".
autosave_location: central

# Whether a real save also writes the .bak (previous contents) and .orig
# (one-time pristine snapshot) pair beside the file. Default: true.
backups_enabled: true
