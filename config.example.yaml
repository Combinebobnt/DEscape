# Example config.yaml -- copy this file to config.yaml in your OS's
# DEscape config directory and edit (Linux: $XDG_CONFIG_HOME/DEscape/ or
# ~/.config/DEscape/; macOS: ~/Library/Application Support/DEscape/;
# Windows: %APPDATA%\DEscape\). Every key below is optional; an omitted
# key falls back to the default noted in its comment. Generated by
# tools/gen_config_example.py
# from descape/settings.py and descape/asset_source.py -- run that script
# after changing either, rather than hand-editing this file (also gated by
# tests/test_config_example.py, so a mismatch fails the default test tier).

# Path to your AoE2:DE install (steamapps/common/AoE2DE or similar).
# Enables real per-tile terrain textures instead of averaged flat colors.
# Also settable via the AOE2DE_INSTALL_PATH env var or the viewer's own
# Load button -- see asset_source.py's module docstring for priority order.
# No default: falls back to flat colors if unset everywhere.
aoe2de_install: /path/to/steamapps/common/AoE2DE

# Path to your AoE2:DE profile folder, the one holding numeric per-account
# folders with resources/ and mods/ inside. Only read, never written, and
# optional: without it only the install's own content is offered. Also
# settable from Settings > General's profile folder row, or via the
# AOE2DE_PROFILE_PATH env var (checked first, overrides both). Default:
# detected, as %USERPROFILE%\Games\Age of Empires 2 DE on Windows, or on
# Linux as the Proton prefix beside aoe2de_install's Steam library
# (steamapps/compatdata/813780/pfx/drive_c/users/steamuser/Games/...).
# See content_roots.py's module docstring.
# aoe2de_profile: /path/to/Games/Age of Empires 2 DE

# Language folder under the install's resources/ (e.g. de, fr, es) that
# trigger reference pickers resolve real object/tech display names from --
# see object_catalog.py's resolve_name(). Only takes effect with
# aoe2de_install also set; falls back to the ALL-CAPS library name otherwise.
# Default: "en".
language: en

# 1-4 (1=Potatest, 2=Potato, 3=Default, 4=Enhanced), see settings.GRAPHICS_QUALITY_LABELS.
# Default: 3.
graphics_quality: 3

# Stepped elevation height, percent of half_h. Only the 8 stops
# 25-200 in steps of 25 are legal; anything else snaps to the
# nearest one on read, see settings.ELEV_STEP_PCT_STOPS.
# Default: 50.
elev_step_pct: 50

# Held-key pan speed for the Pan Up/Down/Left/Right keybinds, in viewport
# pixels per second, Settings > Appearance. Measured in screen pixels like
# the middle-drag pan, so a fixed speed covers fewer tiles the further you
# zoom in. Clamped to 200-2000 on read.
# Default: 700.
pan_speed: 700

# Opacity of walls and gates in percent while View > Layers > Translucent
# Walls is on, Settings > Appearance. Clamped to 10-90 on read.
# Default: 50.
wall_opacity_pct: 50

# Anchor mouse-wheel zoom under the cursor (true) or the view center
# (false). Default: true.
zoom_centered_on_cursor: true

# What the mouse wheel does over the map, per modifier held, Settings >
# Keybinds. Slots: plain, ctrl, shift, alt.
# Actions: zoom, tool, brush_size, rotate, pan_vertical, pan_horizontal, none.
# "tool" steps the brush size or turns Place Unit's preview, whichever
# applies; a tool action with nothing to act on zooms, and so does any other
# modifier combination. Only slots moved off their default are stored, and an
# unknown slot or action is ignored.
# Defaults: plain zoom, ctrl tool, shift zoom, alt zoom.
# The value below is only an example.
# wheel_bindings:
#   plain: tool
#   ctrl: zoom

# App-chrome theme preset, Settings > Appearance. One of:
# light, dark, dim, high_contrast_dark, high_contrast_light, solarized_light,
# solarized_dark, editor_parchment_red, editor_parchment_blue,
# editor_parchment_green, editor_parchment_purple, editor_dark_wood_red,
# editor_dark_wood_blue, editor_dark_wood_green, editor_dark_wood_purple.
# An unknown id falls back to the default. A config with no `theme` but the
# retired `dark_mode: true` reads as dark. Default: editor_parchment_red.
theme: editor_parchment_red

# Per-role chrome colour overrides on top of the preset, "#rrggbb", Settings >
# Appearance > Chrome colours. Roles:
# window, window_text, base, alternate_base, text, button, button_text,
# surface, surface_text, highlight, highlighted_text, tooltip_base,
# tooltip_text, link.
# An unknown role or malformed value is ignored. Switching preset clears them.
theme_colors: {}

# After a file opens, warm the neighbouring zoom levels' unit sprites in
# idle time so the first zoom doesn't stutter, Settings > Appearance.
# Costs a few seconds of background work per open and some memory; never
# blocks the window. Default: true.
preload_zoom_levels: true

# The toolbar's Elevation View, remembered between launches. One of
# flat, stepped, sloped. Anything else falls back to the default on read, see
# terrain_style.TERRAIN_STYLES. Default: stepped.
terrain_style: stepped

# View > Layers, each row on (true) or off (false), remembered between
# launches. Rows:
# terrain_textures (Terrain Textures), terrain_blend (Terrain Blending),
# farm_overlay (Farm Terrain Overlay), small_trees (Small Trees), hero_glow
# (Hero Glow), translucent_walls (Translucent Walls), mod_art (Mod Art).
# An unknown row or a non-true/false value keeps that row's default, shown here.
view_layers:
  terrain_textures: true
  terrain_blend: true
  farm_overlay: true
  small_trees: false
  hero_glow: true
  translucent_walls: false
  mod_art: true

# Mods whose art View > Layers > Mod Art skips, Settings > General > Mod art,
# as the game's mods/mod-status.json Path strings. A listed mod that is no
# longer installed stays listed, so it stays off if resubscribed.
# Default: [] (every enabled mod's art draws). The value below is only an example.
# mod_art_excluded:
#   - subscribed//12345_Example Mod

# Ruler-style distance ticks in the void just outside the map border,
# View > Distance Ticks. Default: false.
distance_ticks: false

# Tiles between adjacent minor ticks. Only 4 or 5 are legal; anything
# else falls back to the default on read, see edge_ticks.TICK_INTERVALS.
# Every 4th minor is a major and carries a tile number.
# Default: 5.
distance_tick_interval: 5

# In Units mode, a count badge over every spot where a unit is hidden under
# another, View > Show Stacked-Unit Badges. Default: true.
stack_badges: true

# Where each stacked-unit badge sits on its tile, Settings > Appearance.
# One of bottom_right, bottom_left, top_right, top_left, above.
# Anything else falls back to the default on read. The four corners tuck the
# badge inside the tile; above is the original look.
# Default: bottom_right.
stack_badge_position: bottom_right

# How Terrain mode's picker shows terrains, switched by the List/Grid buttons
# beside its filter box: list or grid. Anything else falls back to the
# default on read. Default: list.
terrain_picker_mode: list

# Which game's data draws every opened scenario, Settings > Advanced (GH #67):
# auto or aoe2 or ror. auto follows the file's own header; aoe2 or ror shows every
# file in that game's data, read-only when it is the other game's file.
# Anything else falls back to the default on read. Default: auto.
game_data: auto

# The terrain grid's swatch size in px, Settings > Appearance: 32, 48, 64.
# Anything else falls back to the default on read. Default: 48.
terrain_grid_swatch_px: 48

# In Units mode, outline each selected unit in its owner's player colour (GAIA
# keeps unit_select), View > Colour Selection by Owner. Default: true.
selection_by_owner: true

# A line on every tile boundary, View > Grid. Default: false.
grid_overlay: false

# Whether the grid drapes over the terrain rather than lying on the flat
# elevation-0 ground plane, View > Grid > Follow Terrain Elevation. No effect
# in Flat. Default: true.
grid_follow_elevation: true

# A circle around each selected building showing its attack range, View >
# Range Rings > Selected Buildings. Buildings only, and only ones with a
# range. Default: false.
range_rings: false

# Each ring in its owner's player colour, View > Range Rings > Colour by
# Owner. Applies to every ring layer. GAIA keeps the overlay_colors
# range_ring colour. Default: false.
range_rings_by_owner: false

# A circle around every building that has a range, selected or not, in every
# mode, View > Range Rings > All Buildings. Siege units are not included.
# Default: false.
range_rings_buildings: false

# A circle around each selected map revealer showing the area it reveals
# (its line of sight), View > Range Rings > Selected Map Revealers.
# Default: false.
range_rings_selected_revealers: false

# A circle around every map revealer showing the area it reveals (its line of
# sight), in every mode, View > Range Rings > All Map Revealers. Hidden while
# Show Invisible Objects is off. Default: false.
range_rings_revealers: false

# A camera glyph on each player's stored starting view tile, View > Player
# Cameras. Default: false.
camera_markers: false

# The selected trigger's areas, locations and patrol runs drawn on the map,
# View > Trigger Overlay. Draws nothing until a trigger is selected in the
# Triggers panel. Default: true.
trigger_overlay: true

# Triggers mode's Edit Area toggle: with Pan, drag the selected trigger area's
# middle to move it, or its edges and corners to resize it. Default: false.
trigger_area_edit: false

# Edit Area's Tile borders option: the outer ring of tiles resizes instead of
# a thin border. Default: false.
trigger_area_tile_borders: false

# An outline around every unit footprint in scope, View > Footprint Outlines.
# Default: false.
footprint_outlines: false

# Which units carry one: multitile or buildings or units or all. Anything else falls back to the
# default on read. Default: multitile.
footprint_scope: multitile

# One outline around each multi-tile footprint instead of one per tile,
# View > Footprint Outlines > Merge tiles. A diagonal gate, and a draped
# Sloped farm over multi-level steps, keep one per tile. Default: false.
footprint_merged: false

# Each outline in its owner's player colour, View > Footprint Outlines >
# Colour by Owner. GAIA keeps the overlay_colors footprint_outline colour.
# Default: false.
footprint_by_owner: false

# How strongly the grid lines blend into the terrain, Settings > Appearance:
# -100 is solid black lines, 0 is invisible, 100 is solid white ones.
# Out-of-range values clamp. Default: -50.
grid_blend: -50

# Grid line width, Settings > Appearance: map pixels at the current zoom
# level's detail, so roughly half to all of that on screen (screen pixels
# with Follow Terrain Elevation off in Stepped or Sloped). Snaps to the
# nearest of [1, 2, 3, 4]. Default: 1.
grid_thickness: 1

# Main window size in pixels, [width, height]. Persisted automatically on
# resize -- not something you normally set by hand.
# Default: [1280, 720].
window_size: [1280, 720]

# Width in pixels of the left info/trigger panel and the map view,
# [left, right]. Persisted automatically when you drag the split -- not
# something you normally set by hand. Omitted entirely until first saved.
# split_sizes: [340, 900]

# How the Units panel's object list shows objects, set by the buttons above
# it: icons (icon and name rows), names (text rows) or grid (icons only).
# One of icons, names, grid. Default: icons.
units_catalog_mode: icons

# Height in pixels of the system log, below the map view. Persisted
# automatically when you drag the split -- not something you normally set by
# hand. Omitted entirely until first saved; until then the log is four text
# lines tall, so unlike split_sizes above there is no fixed default to quote
# here -- it depends on your font. The value below is only an example.
# log_height: 120

# Height in text lines of each multi-line text box you have dragged taller or
# shorter by its bottom edge (trigger form and Messages mode), keyed
# "trigger.<field>" or "messages.<field>". Persisted automatically when you
# release the drag; a double-click on the edge resets the box and removes its
# key. Clamped to 2-40. Omitted entirely until first saved; until then
# every box is six lines tall. The value below is only an example.
# text_box_lines:
#   trigger.description: 12
#   messages.hints: 10

# File > Open Recent, most-recently-opened first. Persisted automatically
# on every open -- not something you normally set by hand. Capped at
# 10 entries; omitted entirely until first saved. The value below is
# only an example.
# recent_files:
#   - /path/to/recent_scenario.aoe2scenario

# File > New Map…'s last choices, saved automatically when you press Create in
# that dialog -- not something you normally set by hand. Omitted entirely
# until first saved; until then the dialog opens at the values below.
# tiles is clamped to 61-480 and elevation to 0-15; game_data is
# aoe2 or ror; terrain_id is a terrain id (0 is Grass 1).
# new_map:
#   tiles: 120
#   game_data: aoe2
#   terrain_id: 0
#   elevation: 0

