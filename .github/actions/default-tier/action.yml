name: Default test tier
description: >
  Runs the default pytest tier, then the test map items, with the native
  kernel required. On Linux xvfb-run wraps each run; other OSes need no
  display (the tests use Qt's offscreen platform).
  Assumes the install-and-build action already ran, and qt-linux-libs on Linux.
runs:
  using: composite
  steps:
    # --durations: the slowest tests per leg, so a leg's wall time can be compared and trimmed.
    - name: Run the default test tier
      shell: bash
      env:
        DESCAPE_REQUIRE_NATIVE: '1'
      run: |
        wrap=()
        if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a); fi
        "${wrap[@]}" python -m pytest -n auto --maxprocesses 16 --dist loadgroup --durations=60

    # pytest.ini leaves test_map out of the default tier; it needs no examples/.
    # Runs after a red default tier too, so one run reports both steps.
    - name: Run the test map items
      if: ${{ !cancelled() }}
      shell: bash
      env:
        DESCAPE_REQUIRE_NATIVE: '1'
      run: |
        wrap=()
        if [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run -a); fi
        "${wrap[@]}" python -m pytest -n auto --maxprocesses 16 --dist loadgroup -m "test_map and not corpus"
