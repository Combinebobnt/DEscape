name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, label: linux-x86_64}
          - {runner: macos-15,     label: macos-arm64}
          - {runner: windows-2025, label: windows-x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Compute version
        shell: bash
        run: echo "VERSION=$(python -c 'import descape; print(descape.__version__)')" >> "$GITHUB_ENV"

      # Checked before any build/test minutes are spent on a tag push, so a
      # mistyped or premature tag fails immediately instead of after ~30
      # minutes of matrix builds.
      - name: Check tag matches __version__ / CHANGELOG.md (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release_tag.py "${{ github.ref_name }}"

      - name: Install Qt platform plugin system libs (Linux)
        if: runner.os == 'Linux'
        # The xcb plugin dlopens several of these at runtime and fails with
        # "even though it was found" (not a missing-file error) if any are
        # absent -- the hosted ubuntu-22.04 image doesn't ship them all.
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon-x11-0 xvfb
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          libxcb-xkb1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Run the default test tier (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest pytest-qt ruff==0.16.3
          # tests/test_lint.py hardcodes .venv/bin/ruff (the local dev
          # layout); the runner has no .venv, so point that path at the
          # ruff pip just installed instead of building a whole venv.
          mkdir -p .venv/bin
          ln -s "$(command -v ruff)" .venv/bin/ruff
          xvfb-run -a python -m pytest

      - name: Build frozen bundle
        run: python -m PyInstaller packaging/descape.spec --noconfirm

      - name: Verify frozen bundle (self-check + smoke)
        run: python tools/verify_frozen_build.py

      - name: Smoke test (real xcb plugin, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb dist/DEscape/DEscape --smoke

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHON: python
        run: packaging/build_appimage.sh

      - name: Stage licenses into the bundle
        run: |
          python tools/collect_licenses.py --strict --out dist/DEscape/licenses/third-party
          python -c "import shutil; shutil.copy('LICENSE', 'dist/DEscape/LICENSE')"

      - name: Package for upload (posix)
        if: runner.os != 'Windows'
        run: tar -czf "DEscape-${VERSION}-${{ matrix.label }}.tar.gz" -C dist DEscape

      - name: Package for upload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DEscape -DestinationPath "DEscape-$env:VERSION-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DEscape-${{ matrix.label }}
          path: |
            DEscape-${{ env.VERSION }}-${{ matrix.label }}.tar.gz
            DEscape-${{ env.VERSION }}-${{ matrix.label }}.zip
            dist/DEscape-*.AppImage
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_release_tag.py "${{ github.ref_name }}"
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - name: Extract release notes
        run: python3 tools/release_notes.py "${{ github.ref_name }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: DEscape ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
