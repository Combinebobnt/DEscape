name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Linux and Windows only. macOS outgrew a hosted job's 360 min, so its leg is
  # build-macos.yml, dispatched by hand, which attaches its tarball to the draft.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, label: linux-x86_64,   suite-minutes: 180, job-minutes: 210}
          - {runner: windows-2025, label: windows-x86_64, suite-minutes: 180, job-minutes: 210}
    uses: ./.github/workflows/build-leg.yml
    with:
      runner: ${{ matrix.runner }}
      label: ${{ matrix.label }}
      suite-minutes: ${{ matrix.suite-minutes }}
      job-minutes: ${{ matrix.job-minutes }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_release_tag.py "${{ github.ref_name }}"
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - name: Extract release notes
        run: python3 tools/release_notes.py "${{ github.ref_name }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: DEscape ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
