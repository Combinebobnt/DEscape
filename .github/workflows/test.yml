name: test
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: ./.github/actions/qt-linux-libs

      - uses: ./.github/actions/install-and-build

      # The tier contains tests/test_native_composite.py, so the Linux oracle
      # runs here too.
      - uses: ./.github/actions/default-tier
