name: test
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # The same three runners and test steps as build-leg.yml, minus the bundle.
  # macOS runs only the native kernel oracle tests: its full quick suite outgrew
  # 180 min on 3 workers. build-macos.yml (dispatched by hand) runs it in full.
  # Keep the macOS pytest-args identical to build.yml's.
  tier:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, windows-2025]
        include:
          - runner: macos-15
            pytest-args: tests/test_native_composite.py tests/test_sld_native.py
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: ./.github/actions/qt-linux-libs
        if: runner.os == 'Linux'

      # Before anything builds the kernel in place, as in build-leg.yml.
      - name: From-source bootstrap builds the native kernel
        run: python tools/ci_bootstrap_native.py

      - uses: ./.github/actions/install-and-build

      # The quick suite contains the native kernel oracle tests, so each OS's
      # build is compared against numpy here too.
      - uses: ./.github/actions/quick-suite
        timeout-minutes: 180
        with:
          pytest-args: ${{ matrix.pytest-args }}

  # Keeps the required status context `test`; the matrix reports
  # `tier (<runner>)` instead. always(): a skipped required check passes.
  test:
    needs: tier
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Every tier leg passed
        run: test "${{ needs.tier.result }}" = success
