name: build-macos
# The macOS leg with its whole quick suite, which outgrew a hosted job's 360 min
# inside build.yml (whose macOS leg runs only the native kernel oracle tests).
# Dispatched by hand; it gates nothing and publishes nothing.
on:
  workflow_dispatch:
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build-leg.yml
    with:
      runner: macos-15
      label: macos-arm64
      # About 5.5 h on 2026-11-11; a suite timeout builds no bundle.
      suite-minutes: 330
      job-minutes: 350
