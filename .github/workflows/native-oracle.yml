name: native-oracle
# Compares the native kernel against numpy on every OS, but only for a PR that
# touches the kernel, its callers, its build or its oracle tests.
on:
  pull_request:
    paths:
      - descape/_composite_native.pyx
      - descape/native_composite.py
      - descape/composite_backend.py
      - descape/render.py
      - descape/render_cache.py
      - descape/sld_decoder.py
      - tools/build_native.py
      - tools/ci_bootstrap_native.py
      - bootstrap.py
      - requirements.txt
      - requirements-dev.txt
      - packaging/requirements-native.txt
      - packaging/requirements-build.txt
      - tests/test_native_composite.py
      - tests/test_sld_native.py
      - tests/test_terrain_blend_render.py
      # The three oracle files' recursive `from test_*` import closure.
      - tests/test_clipped_sprites.py
      - tests/test_farm_terrain.py
      - tests/test_sld_decoder.py
      - tests/test_sprite_chunks.py
      - tests/test_sprite_edit_bbox.py
      - tests/test_unit_sprites.py
      - pytest.ini
      - tests/conftest.py
      - testkit/**
      - .github/workflows/native-oracle.yml
      - .github/actions/**
permissions:
  contents: read
concurrency:
  group: oracle-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  oracle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: ./.github/actions/qt-linux-libs
        if: runner.os == 'Linux'

      # Before anything builds the kernel in place, as in build.yml.
      - name: From-source bootstrap builds the native kernel
        run: python tools/ci_bootstrap_native.py

      - uses: ./.github/actions/install-and-build

      - name: Native kernel oracle
        env:
          DESCAPE_REQUIRE_NATIVE: '1'
        run: python -m pytest tests/test_native_composite.py tests/test_sld_native.py tests/test_terrain_blend_render.py
