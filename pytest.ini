[pytest]
minversion = 7.0
pythonpath = .
# Pin pytest-qt's binding rather than letting it auto-detect: detection
# order is PySide6, PyQt5, PyQt6, so a stray PySide6 in a contributor's
# environment would silently run the gui tier against a different binding
# than descape/ itself imports.
qt_api = pyqt5
markers =
    corpus: needs untracked local data -- the real (gitignored) examples/
        corpus, or, for the sprite-reach check, a real AoE2:DE install
    slow: full-render comparisons, O(pixels) geometry sweeps
    gui: offscreen ViewerWindow tests, needs PyQt5
addopts = -m "not corpus and not slow" -ra
